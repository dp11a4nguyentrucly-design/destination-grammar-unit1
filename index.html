/* ================= HELPERS ================= */

function norm(s){
  return s.toLowerCase().replace(/['’]/g,"'").replace(/\s+/g," ").trim();
}
function matches(userVal, ans){
  const u = norm(userVal);
  if(!u) return false;
  const list = Array.isArray(ans) ? ans : [ans];
  return list.some(a => norm(a) === u);
}

    const btn = document.createElement('button');
    const done = checkedState[id];
    btn.innerHTML = LABELS[id] + '<span class="dot' + (done ? ' done' : '') + '"></span>';
    btn.dataset.id = id;
    btn.onclick = ()=> showTab(id);
    nav.appendChild(btn);
  });
  updateActiveTab();
}

function updateActiveTab(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.id === currentTab);
  });
}

function updateScoreBox(){
  const ids = Object.keys(checkedState);
  let correct=0, total=0;
  ids.forEach(id=>{ correct += checkedState[id].correct; total += checkedState[id].total; });
  const pct = total ? Math.round(100*correct/total) : 0;
  document.getElementById('scoreBox').textContent =
    ids.length + ' / 10 exercises checked' + (total ? ' · ' + correct + '/' + total + ' correct (' + pct + '%)' : '');
}

let currentTab = 'ref';

function showTab(id){
  currentTab = id;
  updateActiveTab();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(id === 'ref'){
    content.appendChild(buildReference());
  } else {
    content.appendChild(buildExercise(id));
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

function buildReference(){
  const div = document.createElement('div');
  div.className = 'panel ref';
  div.innerHTML = `
    <h3 class="pill">Present perfect simple</h3>
    <table class="ref-table">
      <tr><td>Situations and states that started in the past and are still true</td><td>I've been a member of MENSA for over five years.</td></tr>
      <tr><td>A series of actions continuing up to now</td><td>She's done a BA, an MA and a PhD so far.</td></tr>
      <tr><td>Completed actions at a time in the past which is not important or relevant</td><td>Have you ever read any books by Edward De Bono?</td></tr>
      <tr><td>Completed actions where the important thing is the present result</td><td>She's been awarded a scholarship to study at Harvard.</td></tr>
      <tr><td>Actions completed recently</td><td>I've just received my exam results.</td></tr>
      <tr><td>The future (in time clauses) — see Unit 5</td><td>Tell me when you've finished the report.</td></tr>
    </table>
    <div class="box"><b>Words &amp; phrases often used with it:</b> since / for / it's the first/second/etc time / before / already / yet / ever / just / still / recently / up to now / (up) until now / so far</div>
    <div class="us-uk"><div class="h">US vs UK grammar</div>
      In American English the past simple is often used instead of the present perfect simple.<br>
      US: <i>Did you find the answer yet?</i> &nbsp; UK: <i>Have you found the answer yet?</i><br>
      US: <i>I already found the answer.</i> &nbsp; UK: <i>I've already found the answer.</i><br><br>
      In informal American English, <i>gotten</i> is sometimes used instead of <i>got</i> (obtain / become / move).<br>
      US: <i>I haven't gotten the books yet.</i> &nbsp; UK: <i>I haven't got the books yet.</i>
    </div>

    <h3 class="pill">Present perfect continuous</h3>
    <table class="ref-table">
      <tr><td>Actions/situations continuing up to the present (or just before it)</td><td>We've all been wondering what to get Tony for his birthday and we just can't decide.</td></tr>
      <tr><td>The future (in time clauses) — see Unit 5</td><td>I won't take my driving test until I've been having lessons for at least two months.</td></tr>
    </table>
    <div class="watch"><div class="tag">Watch out!</div><div class="body"><ul>
      <li>We usually use the present perfect <b>simple</b> to specify a particular number of times/things. ✓ I've written two essays this week.</li>
      <li>We usually use the present perfect <b>continuous</b> to emphasise duration. ✓ I've worked here for five years (no emphasis) vs I've been working here for five years (emphasises duration).</li>
    </ul></div></div>
    <div class="box"><b>Words &amp; phrases often used with it:</b> since / for / just / all day/week/etc</div>

    <h3 class="pill">Stative and non-stative uses of verbs</h3>
    <div class="box">When certain verbs describe states, they're generally used in simple tenses rather than continuous tenses.</div>
    <table class="ref-table">
      <tr><td>Communication</td><td>agree, deny, disagree</td></tr>
      <tr><td>Thinking</td><td>believe, consider, doubt, expect, imagine, know, mean, realise, suppose, suspect, think, understand</td></tr>
      <tr><td>Existence</td><td>be, exist</td></tr>
      <tr><td>Emotions</td><td>adore, appeal, appreciate, desire, despise, detest, dislike, envy, fear, feel, forgive, hate, like, love, mind, need, pity, prefer, satisfy, trust, want, wish</td></tr>
      <tr><td>Perception</td><td>appear, hear, look, notice, recognise, resemble, see, seem, smell, sound, taste</td></tr>
      <tr><td>Possession &amp; relationships</td><td>belong, concern, consist, contain, cost, depend, equal, fit, have, include, involve, lack, measure, owe, own, possess, suit, weigh</td></tr>
      <tr><td>Other</td><td>deserve, matter</td></tr>
    </table>
    <div class="watch"><div class="tag">Watch out!</div><div class="body">
      Many of these can also be used in continuous tenses when they describe actions rather than states: appeal, be, consider, depend, feel, have, include, look, mean, mind, see, smell, taste, think, weigh.<br>
      ✓ I think it's important to know how to use a computer. (state: think = believe)<br>
      ✓ I'm thinking about going on a computer course. (action: think = consider)
    </div></div>
  `;
  return div;
}

function buildBlankInput(hint, ans, idx, key){
  const wrap = document.createElement('span');
  wrap.className = 'blank-wrap';
  if(hint){
    const h = document.createElement('span');
    h.className = 'hint';
    h.textContent = '(' + hint + ')';
    wrap.appendChild(h);
  }
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'blank';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.dataset.key = key;
  input.dataset.idx = idx;
  input.size = Math.max(6, (Array.isArray(ans)?ans[0]:ans).length);
  wrap.appendChild(input);
  const corr = document.createElement('span');
  corr.className = 'correction';
  corr.style.display = 'none';
  wrap.appendChild(corr);
  return wrap;
}

function buildExercise(id){
  const ex = EXERCISES[id];
  const div = document.createElement('div');
  div.className = 'panel';
  const head = document.createElement('div');
  head.className = 'exercise-head';
  head.innerHTML = '<span class="letter">' + id + '</span><span class="instr">' + ex.instr + '</span>';
  div.appendChild(head);

  if(ex.bank){
    const bank = document.createElement('div');
    bank.className = 'wordbank';
    bank.textContent = ex.bank;
    div.appendChild(bank);
  }

  const answerRegistry = []; // {answers, blankEl-input}
  let blankCounter = 0;

  const container = document.createElement('div');
  container.className = ex.dialogue ? 'dialogue' : (ex.passage ? 'item' : '');

  ex.items.forEach((itemDef, itemIdx)=>{
    let node;
    if(ex.erratum){
      // F-style: [sentenceHTML, answer]
      const [html, ans] = itemDef;
      node = document.createElement('div');
      node.className = 'item';
      const num = document.createElement('span');
      num.className = 'num';
      num.textContent = (itemIdx+1) + '.';
      node.appendChild(num);
      const span = document.createElement('span');
      span.innerHTML = html + '  →  ';
      node.appendChild(span);
      const key = id + '-' + itemIdx;
      const blankWrap = buildBlankInput(null, ans, itemIdx, key);
      answerRegistry.push({key, answers:[ans], input: blankWrap.querySelector('input')});
      node.appendChild(blankWrap);
    } else {
      const [template, blanks] = itemDef;
      let html = template;
      const inputsForItem = [];
      blanks.forEach((b, bIdx)=>{
        const [hint, ansOrChoice] = b;
        const key = id + '-' + itemIdx + '-' + bIdx;
        let el;
        if(ex.choice){
          // ansOrChoice = [options[], correctAnswer(s)]
          const [options, correct] = ansOrChoice;
          el = buildChoiceGroup(options, correct, key);
          answerRegistry.push({key, choice:true, correct, el});
        } else {
          const wrap = buildBlankInput(hint, ansOrChoice, bIdx, key);
          answerRegistry.push({key, answers:[ansOrChoice], input: wrap.querySelector('input')});
          el = wrap;
        }
        inputsForItem.push(el);
      });
      // build node by replacing {0},{1}... in template with placeholders, then swap
      node = document.createElement('div');
      node.className = ex.dialogue ? '' : 'item';
      let numPrefix = '';
      if(!ex.dialogue && !ex.passage){
        numPrefix = '<span class="num">' + (itemIdx+1) + '.</span> ';
      }
      const parts = html.split(/\{(\d+)\}/g);
      const frag = document.createElement('span');
      frag.innerHTML = numPrefix;
      node.appendChild(frag);
      parts.forEach((part, i)=>{
        if(i % 2 === 0){
          const span = document.createElement('span');
          span.innerHTML = part;
          node.appendChild(span);
        } else {
          const bIdx = parseInt(part,10);
          node.appendChild(inputsForItem[bIdx]);
        }
      });
    }
    container.appendChild(node);
  });

  div.appendChild(container);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const btn = document.createElement('button');
  btn.className = 'check';
  btn.textContent = 'Check answers';
  const result = document.createElement('span');
  result.className = 'result';
  actions.appendChild(btn);
  actions.appendChild(result);
  div.appendChild(actions);

  btn.onclick = ()=>{
    let correct=0, total=0;
    answerRegistry.forEach(entry=>{
      total++;
      if(entry.choice){
        const selected = entry.el.dataset.selected;
        const ok = selected && matches(selected, entry.correct);
        entry.el.querySelectorAll('.choice-btn').forEach(cb=>{
          cb.classList.remove('correct','incorrect');
          const isCorrectOpt = matches(cb.textContent, entry.correct);
          if(selected){
            if(cb.textContent === selected){
              cb.classList.add(ok ? 'correct' : 'incorrect');
            }
            if(!ok && isCorrectOpt){ cb.classList.add('correct'); }
          }
        });
        if(ok) correct++;
      } else {
        const val = entry.input.value;
        const ok = matches(val, entry.answers[0]);
        entry.input.classList.remove('correct','incorrect');
        entry.input.classList.add(ok ? 'correct' : 'incorrect');
        const corrSpan = entry.input.parentElement.querySelector('.correction');
        if(!ok){
          const answerList = Array.isArray(entry.answers[0]) ? entry.answers[0].join(' / ') : entry.answers[0];
          corrSpan.textContent = '✓ ' + answerList;
          corrSpan.style.display = 'block';
        } else {
          corrSpan.style.display = 'none';
        }
        if(ok) correct++;
      }
    });
    result.textContent = correct + ' / ' + total + ' correct';
    result.className = 'result ' + (correct===total ? 'good' : (correct===0 ? 'bad' : ''));
    checkedState[id] = {correct, total};
    renderTabs();
    updateScoreBox();
  };

  return div;
}

function buildChoiceGroup(options, correct, key){
  const wrap = document.createElement('span');
  wrap.className = 'choice-wrap';
  wrap.dataset.selected = '';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice-btn';
    b.textContent = opt;
    b.onclick = ()=>{
      wrap.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected'));
      b.classList.add('selected');
      wrap.dataset.selected = opt;
    };
    wrap.appendChild(b);
  });
  return wrap;
}

/* ================= INIT ================= */
renderTabs();
showTab('ref');
</script>
