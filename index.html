<style>

  select#unitSelect{

    padding:8px 12px; font-size:14px; font-weight:700; font-family:inherit;
  }
  header.top .score{font-size:13px; background:rgba(255,255,255,.15); padding:6px 12px; border-radius:20px;}

  nav.tabs button{flex:0 0 auto; background:none; border:none; color:#fff; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer; opacity:.8; border-bottom:3px solid transparent; white-space:nowrap;}

  nav.tabs button .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:6px; vertical-align:middle; background:rgba(255,255,255,.35);}

  button.check{background:var(--green); color:#fff; border:none; padding:10px 22px; border-radius:20px; font-size:14px; font-weight:700; cursor:pointer;}
  button.check:hover{background:var(--green-dark);}

  footer.foot{text-align:center; font-size:12px; color:var(--muted); padding:20px;}

</head>

const REF_1 = `
  <h3 class="pill">Present perfect simple</h3>
  <table class="ref-table">
    <tr><td>Situations and states that started in the past and are still true</td><td>I've been a member of MENSA for over five years.</td></tr>
    <tr><td>A series of actions continuing up to now</td><td>She's done a BA, an MA and a PhD so far.</td></tr>

    <tr><td>The future (in time clauses) — see Unit 5</td><td>Tell me when you've finished the report.</td></tr>

  <div class="box"><b>Words &amp; phrases often used with it:</b> since / for / it's the first/second/etc time / before / already / yet / ever / just / still / recently / up to now / (up) until now / so far</div>
  <div class="us-uk"><div class="h">US vs UK grammar</div>
    In American English the past simple is often used instead of the present perfect simple.<br>
    US: <i>Did you find the answer yet?</i> &nbsp; UK: <i>Have you found the answer yet?</i><br>
    US: <i>I already found the answer.</i> &nbsp; UK: <i>I've already found the answer.</i><br><br>
    In informal American English, <i>gotten</i> is sometimes used instead of <i>got</i> (obtain / become / move).<br>

  </div>
  <h3 class="pill">Present perfect continuous</h3>
  <table class="ref-table">
    <tr><td>Actions/situations continuing up to the present (or just before it)</td><td>We've all been wondering what to get Tony for his birthday and we just can't decide.</td></tr>

    <tr><td>Annoying/amusing past habits (usually with always)</td><td>Tina was always taking things apart to see how they worked.</td></tr>

    <li>Past continuous = background events; past simple = main events. ✓ We were talking about MP3s when Andrea mentioned her website.</li>

    <i>Get used to</i> = the process of becoming familiar: ✓ People quickly got used to travelling by train.
  </div></div>
`;

let currentUnitIdx = 0;
let currentTab = 'ref';
const checkedState = {}; // "unitId-exId" -> {correct,total}

/* ============ HELPERS ============ */
function norm(s){ return s.toLowerCase().replace(/['’]/g,"'").replace(/\s+/g," ").trim(); }
function matches(userVal, ans){
  const u = norm(userVal);
  if(!u) return false;
  const list = Array.isArray(ans) ? ans : [ans];
  return list.some(a => norm(a) === u);
}

function currentUnit(){ return UNITS[currentUnitIdx]; }
function tabOrder(){ return ['ref', ...Object.keys(currentUnit().exercises)]; }

/* ============ RENDER: SHELL ============ */
function populateUnitSelect(){
  const sel = document.getElementById('unitSelect');
  sel.innerHTML = '';
  UNITS.forEach((u,i)=>{
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = u.title;
    sel.appendChild(opt);
  });
  sel.value = currentUnitIdx;
  sel.onchange = ()=>{
    currentUnitIdx = parseInt(sel.value,10);
    currentTab = 'ref';
    renderTabs();
    showTab('ref');
  };
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  tabOrder().forEach(id=>{
    const btn = document.createElement('button');
    const key = currentUnit().id + '-' + id;
    const done = checkedState[key];
    btn.innerHTML = (id==='ref' ? 'Reference' : id) + '<span class="dot' + (done?' done':'') + '"></span>';
    btn.dataset.id = id;
    btn.onclick = ()=> showTab(id);
    nav.appendChild(btn);
  });
  updateActiveTab();
  updateScoreBox();
}
function updateActiveTab(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.id===currentTab));
}
function updateScoreBox(){
  const u = currentUnit();
  const ids = Object.keys(u.exercises).map(id=>u.id+'-'+id);
  let done=0, correct=0, total=0;
  ids.forEach(k=>{ if(checkedState[k]){ done++; correct+=checkedState[k].correct; total+=checkedState[k].total; } });
  const pct = total ? Math.round(100*correct/total) : 0;
  document.getElementById('scoreBox').textContent =
    done + ' / ' + ids.length + ' exercises checked' + (total ? ' · ' + correct + '/' + total + ' (' + pct + '%)' : '');
}

function showTab(id){
  currentTab = id;
  updateActiveTab();
  const content = document.getElementById('content');
  content.innerHTML = '';
  if(id === 'ref'){
    const div = document.createElement('div');
    div.className = 'panel ref';
    div.innerHTML = currentUnit().ref;
    content.appendChild(div);
  } else {
    content.appendChild(buildExercise(id));
  }
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============ RENDER: EXERCISES ============ */
function buildBlankInput(hint, ans){
  const wrap = document.createElement('span');
  wrap.className = 'blank-wrap';
  if(hint){
    const h = document.createElement('span'); h.className='hint'; h.textContent = '(' + hint + ')';
    wrap.appendChild(h);
  }
  const input = document.createElement('input');
  input.type='text'; input.className='blank'; input.autocomplete='off'; input.spellcheck=false;
  input.size = Math.max(6, (Array.isArray(ans)?ans[0]:ans).length);
  wrap.appendChild(input);
  const corr = document.createElement('span'); corr.className='correction'; corr.style.display='none';
  wrap.appendChild(corr);
  return wrap;
}
function buildChoiceGroup(options, correct){
  const wrap = document.createElement('span');
  wrap.className = 'choice-wrap'; wrap.dataset.selected='';
  options.forEach(opt=>{
    const b=document.createElement('button'); b.type='button'; b.className='choice-btn'; b.textContent=opt;
    b.onclick=()=>{ wrap.querySelectorAll('.choice-btn').forEach(x=>x.classList.remove('selected')); b.classList.add('selected'); wrap.dataset.selected=opt; };
    wrap.appendChild(b);
  });
  return wrap;
}

function buildExercise(id){
  const ex = currentUnit().exercises[id];
  const div = document.createElement('div');
  div.className = 'panel';
  const head = document.createElement('div');
  head.className = 'exercise-head';
  head.innerHTML = '<span class="letter">'+id+'</span><span class="instr">'+ex.instr+'</span>';
  div.appendChild(head);
  if(ex.bank){
    const bank=document.createElement('div'); bank.className='wordbank'; bank.textContent=ex.bank; div.appendChild(bank);
  }
  const answerRegistry = [];
  const container = document.createElement('div');
  container.className = ex.dialogue ? 'dialogue' : (ex.passage ? 'item' : '');

  ex.items.forEach((itemDef, itemIdx)=>{
    let node;
    if(ex.erratum){
      const [html, ans] = itemDef;
      node = document.createElement('div'); node.className='item';
      const num=document.createElement('span'); num.className='num'; num.textContent=(itemIdx+1)+'.'; node.appendChild(num);
      const span=document.createElement('span'); span.innerHTML = html + '  →  '; node.appendChild(span);
      const blankWrap = buildBlankInput(null, ans);
      answerRegistry.push({answers:[ans], input: blankWrap.querySelector('input')});
      node.appendChild(blankWrap);
    } else {
      const [template, blanks] = itemDef;
      const inputsForItem = [];
      blanks.forEach(b=>{
        const [hint, ansOrChoice] = b;
        let el;
        if(ex.choice){
          const [options, correct] = ansOrChoice;
          el = buildChoiceGroup(options, correct);
          answerRegistry.push({choice:true, correct, el});
        } else {
          const wrap = buildBlankInput(hint, ansOrChoice);
          answerRegistry.push({answers:[ansOrChoice], input: wrap.querySelector('input')});
          el = wrap;
        }
        inputsForItem.push(el);
      });
      node = document.createElement('div');
      node.className = ex.dialogue ? '' : 'item';
      let numPrefix = (!ex.dialogue && !ex.passage) ? '<span class="num">'+(itemIdx+1)+'.</span> ' : '';
      const frag = document.createElement('span'); frag.innerHTML = numPrefix; node.appendChild(frag);
      const parts = template.split(/\{(\d+)\}/g);
      parts.forEach((part,i)=>{
        if(i%2===0){ const span=document.createElement('span'); span.innerHTML=part; node.appendChild(span); }
        else { node.appendChild(inputsForItem[parseInt(part,10)]); }
      });
    }
    container.appendChild(node);
  });
  div.appendChild(container);

  const actions=document.createElement('div'); actions.className='actions';
  const btn=document.createElement('button'); btn.className='check'; btn.textContent='Check answers';
  const result=document.createElement('span'); result.className='result';
  actions.appendChild(btn); actions.appendChild(result); div.appendChild(actions);

  btn.onclick = ()=>{
    let correct=0, total=0;
    answerRegistry.forEach(entry=>{
      total++;
      if(entry.choice){
        const selected = entry.el.dataset.selected;
        const ok = selected && matches(selected, entry.correct);
        entry.el.querySelectorAll('.choice-btn').forEach(cb=>{
          cb.classList.remove('correct','incorrect');
          const isCorrectOpt = matches(cb.textContent, entry.correct);
          if(selected){
            if(cb.textContent===selected) cb.classList.add(ok?'correct':'incorrect');
            if(!ok && isCorrectOpt) cb.classList.add('correct');
          }
        });
        if(ok) correct++;
      } else {
        const val = entry.input.value;
        const ok = matches(val, entry.answers[0]);
        entry.input.classList.remove('correct','incorrect');
        entry.input.classList.add(ok?'correct':'incorrect');
        const corrSpan = entry.input.parentElement.querySelector('.correction');
        if(!ok){
          const answerList = Array.isArray(entry.answers[0]) ? entry.answers[0].join(' / ') : entry.answers[0];
          corrSpan.textContent = '✓ ' + answerList; corrSpan.style.display='block';
        } else { corrSpan.style.display='none'; }
        if(ok) correct++;
      }
    });
    result.textContent = correct+' / '+total+' correct';
    result.className = 'result ' + (correct===total?'good':(correct===0?'bad':''));
    checkedState[currentUnit().id+'-'+id] = {correct, total};
    renderTabs();
  };
  return div;
}

populateUnitSelect();
renderTabs();
showTab('ref');
